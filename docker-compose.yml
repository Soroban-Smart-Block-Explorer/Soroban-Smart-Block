services:
  postgres:
    image: postgres:15-alpine
    container_name: soroban-postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=soroban
      - POSTGRES_PASSWORD=soroban_secret
      - POSTGRES_DB=soroban_explorer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soroban -d soroban_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5

  stellar-quickstart:
    image: stellar/quickstart:testing
    container_name: soroban-quickstart
    ports:
      - "8000:8000"
    command: --standalone --enable-soroban-rpc
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile.dev
    container_name: soroban-indexer
    ports:
      - "3001:3001"
    volumes:
      - ./indexer/src:/app/src
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/soroban_explorer
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:3001/api/setup/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: soroban-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:3001
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      indexer:
        condition: service_healthy

  # NOTE: not yet fully wired for automated first-run seeding — this image
  # has no Rust/wasm32 toolchain or `soroban`/`stellar` CLI, so
  # contracts/deploy.sh can only run here if the wasm was already built on
  # the host and `deploy.sh`'s hardcoded REGISTRY_ID placeholder has been
  # replaced with a real deployed registry contract ID. Left as a documented
  # manual step (see docs/testnet-deployment.md) rather than a working
  # docker-compose service for now.
  seed:
    image: node:20-alpine
    container_name: soroban-seed
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "echo 'Seeding is a manual step — see docs/testnet-deployment.md' && exit 0"
    depends_on:
      postgres:
        condition: service_healthy
      stellar-quickstart:
        condition: service_healthy
      indexer:
        condition: service_started

volumes:
  pgdata:
