# cargo-deny configuration — license compliance for the Rust workspace
# (contracts/explorer, contracts/ticket). Run with `cargo deny check licenses`.
#
# Closes #743 — CI fails a PR that introduces a dependency with a license
# outside this allowlist. Add a new license here (with justification in the
# PR) rather than disabling the check.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
ignore = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
