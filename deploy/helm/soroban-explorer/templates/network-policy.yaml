{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller and Prometheus may reach indexer pods; the
# frontend is reachable from the ingress controller only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "se.name" . }}-indexer
spec:
  podSelector:
    matchExpressions:
      - {key: role, operator: In, values: [api, ingest, workers]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {}
      ports: [{port: http}]
{{- end }}
