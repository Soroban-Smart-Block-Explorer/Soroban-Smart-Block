name: CD — Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, production]
      image_tag:
        description: "Docker image tag to deploy (defaults to latest for env)"
        required: false
        type: string
  push:
    branches:
      - "release/*"
    tags:
      - "v*"

concurrency:
  group: ${{ (startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.environment == 'staging') && 'staging-deploy-lock' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Resolve target environment ────────────────────────────────────────────────
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      image_tag: ${{ steps.set.outputs.image_tag }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.image_tag || github.sha }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="production"
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV="staging"
            TAG="${{ github.sha }}"
          else
            ENV="dev"
            TAG="${{ github.sha }}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      # Error-budget policy (#943): block feature deploys when the budget is
      # exhausted. Reliability fixes bypass with "[reliability]" in the commit.
      - name: Error budget freeze check
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ -z "$PROMETHEUS_URL" ]]; then echo "PROMETHEUS_URL not set; skipping"; exit 0; fi
          if [[ "$COMMIT_MSG" == *"[reliability]"* ]]; then echo "Reliability fix; bypassing freeze"; exit 0; fi
          REMAINING=$(curl -fsS "$PROMETHEUS_URL/api/v1/query" --data-urlencode 'query=min(slo:api_error_budget:remaining)' | jq -r '.data.result[0].value[1] // "1"')
          echo "Error budget remaining: $REMAINING"
          if awk "BEGIN{exit !($REMAINING <= 0)}"; then
            echo "::error::Error budget exhausted — feature deploys are frozen (docs/guides/slo-policy.md)"
            exit 1
          fi

  # ── 1. Build & Push Docker Images ────────────────────────────────────────────
  build-images:
    name: Build Images (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-env
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      indexer_digest: ${{ steps.build-indexer.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build and push indexer
        id: build-indexer
        uses: docker/build-push-action@v6
        with:
          context: ./indexer
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexer:${{ needs.resolve-env.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexer:${{ needs.resolve-env.outputs.environment }}-latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexer:buildcache
            type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.environment=${{ needs.resolve-env.outputs.environment }}

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ needs.resolve-env.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ needs.resolve-env.outputs.environment }}-latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:buildcache
            type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.environment=${{ needs.resolve-env.outputs.environment }}

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Attest indexer image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexer
          subject-digest: ${{ steps.build-indexer.outputs.digest }}
          push-to-registry: true

      - name: Attest frontend image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

      # Keyless cosign signatures via GitHub OIDC (#930).
      - uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless)
        env:
          INDEXER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexer@${{ steps.build-indexer.outputs.digest }}
          FRONTEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend@${{ steps.build-frontend.outputs.digest }}
        run: cosign sign --yes "$INDEXER" "$FRONTEND"

  # ── 1b. Refuse to deploy unsigned or tampered images ─────────────────────────
  verify-images:
    name: Verify image signatures
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
      packages: read
    steps:
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify cosign signatures and provenance
        env:
          INDEXER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexer@${{ needs.build-images.outputs.indexer_digest }}
          FRONTEND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend@${{ needs.build-images.outputs.frontend_digest }}
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/deploy\.yml@
        run: |
          for IMG in "$INDEXER" "$FRONTEND"; do
            cosign verify "$IMG" \
              --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

  # ── 2. Run DB init (schema setup) ────────────────────────────────────────────
  db-init:
    name: DB Init (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve-env, build-images, verify-images]
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install indexer deps
        run: npm ci
        working-directory: indexer

      - name: Run DB schema init
        run: node -e "import('./src/db.js').then(({db}) => db.init())"
        working-directory: indexer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify DB connection
        run: node -e "import('./src/db.js').then(({db}) => db.query('SELECT 1'))"
        working-directory: indexer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── 3a. Deploy to dev ────────────────────────────────────────────────────────
  # ── Helm chart test on kind: install, smoke, rolling upgrade under load ────
  helm-kind-test:
    name: Helm chart — kind rolling upgrade
    runs-on: ubuntu-latest
    needs: [resolve-env, build-images]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: explorer

      - name: Install Argo Rollouts and Redis
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/install.yaml
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout 3m
          kubectl create deployment redis --image=redis:7-alpine
          kubectl expose deployment redis --port 6379
          kubectl create secret generic soroban-explorer-redis --from-literal=REDIS_URL=redis://redis:6379

      - name: Lint and install chart
        env:
          TAG: ${{ needs.resolve-env.outputs.image_tag }}
        run: |
          helm lint deploy/helm/soroban-explorer
          helm upgrade --install explorer deploy/helm/soroban-explorer --wait --timeout 10m \
            --set image.tag="$TAG" --set preview.enabled=true --set migrations.enabled=false \
            --set canary.enabled=false --set serviceMonitor.enabled=false --set ingress.enabled=false \
            --set api.hpa.enabled=false --set workers.hpa.enabled=false
          kubectl argo rollouts status explorer-api --timeout 5m 2>/dev/null || kubectl rollout status deploy/explorer-workers

      - name: Smoke test
        run: |
          kubectl port-forward svc/explorer-api 3001:80 >/dev/null 2>&1 &
          sleep 5
          curl -sf http://localhost:3001/health/ready
          curl -sf "http://localhost:3001/api/events?limit=1"

      # k6 runs in-cluster against the Service so traffic follows endpoint
      # changes (a port-forward would pin one pod and fail on its termination).
      - name: Rolling upgrade under load (0 failed requests)
        run: |
          kubectl run k6 -i --rm --image=grafana/k6 --restart=Never -- \
            run -e INDEXER_URL=http://explorer-api -e DURATION=3m - < e2e/test/load/rolling-upgrade.js &
          K6=$!
          sleep 30
          helm upgrade explorer deploy/helm/soroban-explorer --reuse-values --wait --timeout 10m
          kubectl patch rollout explorer-api --type merge \
            -p "{\"spec\":{\"restartAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
          wait $K6

  deploy-dev:
    name: Deploy — dev
    runs-on: ubuntu-latest
    needs: [resolve-env, db-init]
    if: needs.resolve-env.outputs.environment == 'dev'
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Health check (baseline)
        run: curl -sf "${{ vars.APP_URL }}/api/health" || true

      - name: Deploy via docker-compose
        run: |
          echo "Deploying to dev (immediate restart)"
          echo "IMAGE_TAG=${{ needs.resolve-env.outputs.image_tag }}" > .env.deploy
          echo "REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> .env.deploy
        # In a real deployment:
        # ssh $DEV_HOST "docker-compose pull && docker-compose up -d"

      - name: Post-deploy health check
        run: |
          echo "Waiting for services..."
          sleep 10
          curl -sf "${{ vars.APP_URL }}/api/health"

  # ── 3b. Deploy to staging (canary) ───────────────────────────────────────
  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    needs: [resolve-env, db-init]
    if: needs.resolve-env.outputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Health check (baseline blue)
        run: curl -sf "${{ vars.APP_URL }}/api/health"

      - uses: azure/setup-helm@v4

      - name: Install Argo Rollouts kubectl plugin
        run: |
          curl -sLo kubectl-argo-rollouts https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          sudo install kubectl-argo-rollouts /usr/local/bin/

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      # Progressive delivery: 5% -> 25% -> 50% -> 100% with SLO analysis at
      # each step (deploy/rollouts/analysis-templates.yaml). A failed analysis
      # aborts the rollout and Argo reverts traffic to the stable ReplicaSet.
      - name: Canary rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          NS: soroban-explorer-${{ needs.resolve-env.outputs.environment }}
        run: |
          kubectl apply -n "$NS" -f deploy/rollouts/
          helm upgrade --install explorer deploy/helm/soroban-explorer -n "$NS" \
            --set image.tag=${{ needs.resolve-env.outputs.image_tag }} \
            --set ingress.host=${{ vars.APP_HOST }}
          for r in explorer-api explorer-frontend explorer-ingest; do
            kubectl argo rollouts status "$r" -n "$NS" --timeout 60m
          done

      - name: Report failing analysis
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: kubectl get analysisrun -n soroban-explorer-${{ needs.resolve-env.outputs.environment }} -o wide | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy health check (green)
        run: |
          sleep 15
          curl -sf "${{ vars.APP_URL }}/api/health"
          curl -sf "${{ vars.APP_URL }}/api/events?limit=1"

  # ── 3c. Deploy to production (canary, requires approval) ─────────────────────
  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: [resolve-env, db-init]
    if: needs.resolve-env.outputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Health check (baseline)
        run: curl -sf "${{ vars.APP_URL }}/api/health"

      - uses: azure/setup-helm@v4

      - name: Install Argo Rollouts kubectl plugin
        run: |
          curl -sLo kubectl-argo-rollouts https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          sudo install kubectl-argo-rollouts /usr/local/bin/

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      # Progressive delivery: 5% -> 25% -> 50% -> 100% with SLO analysis at
      # each step (deploy/rollouts/analysis-templates.yaml). A failed analysis
      # aborts the rollout and Argo reverts traffic to the stable ReplicaSet.
      - name: Canary rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          NS: soroban-explorer-${{ needs.resolve-env.outputs.environment }}
        run: |
          kubectl apply -n "$NS" -f deploy/rollouts/
          helm upgrade --install explorer deploy/helm/soroban-explorer -n "$NS" \
            --set image.tag=${{ needs.resolve-env.outputs.image_tag }} \
            --set ingress.host=${{ vars.APP_HOST }}
          for r in explorer-api explorer-frontend explorer-ingest; do
            kubectl argo rollouts status "$r" -n "$NS" --timeout 60m
          done

      - name: Report failing analysis
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: kubectl get analysisrun -n soroban-explorer-${{ needs.resolve-env.outputs.environment }} -o wide | tee -a "$GITHUB_STEP_SUMMARY"


  # ── 4. Post-deployment Smoke Tests ───────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs:
      - resolve-env
      - deploy-dev
      - deploy-staging
      - deploy-production
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: API health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/api/health")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed (HTTP 200)"

      - name: Events endpoint check
        run: |
          RESPONSE=$(curl -s "${{ vars.APP_URL }}/api/events?limit=1")
          echo "$RESPONSE" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Expected array'"
          echo "Events endpoint returned a valid array"

      - name: WebSocket connectivity check
        run: |
          npm install -g wscat
          timeout 10 wscat -c "wss://${{ vars.WS_HOST }}" --execute "ping" || true
          echo "WebSocket connection test completed"

      - name: Indexer lag check (< 30 ledgers behind)
        run: |
          METRICS=$(curl -s "${{ vars.APP_URL }}/api/health")
          LAG=$(echo "$METRICS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('indexer', {}).get('ledger_lag', 0))
          " 2>/dev/null || echo 0)
          echo "Indexer ledger lag: $LAG"
          if [ "$LAG" -gt 30 ]; then
            echo "::error::Indexer is $LAG ledgers behind (threshold: 30)"
            exit 1
          fi

      - name: Notify deployment success
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":white_check_mark: *Deploy successful* to `${{ needs.resolve-env.outputs.environment }}` — `${{ needs.resolve-env.outputs.image_tag }}` <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ── 5. Rollback ──────────────────────────────────────────────────────────────
  rollback:
    name: Rollback (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs:
      - resolve-env
      - smoke-tests
    if: failure() && needs.smoke-tests.result == 'failure'
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Roll back Docker containers
        run: |
          echo "Rolling back to previous image tag..."
          echo "This restores the previous ${{ needs.resolve-env.outputs.environment }}-latest tag"
          # In a real deployment:
          # docker service update --image <previous-tag> indexer
          # docker service update --image <previous-tag> frontend

      - name: Roll back migrations (if any)
        run: |
          echo "Rolling back most recent migration..."
          # npm run migrate:down
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify rollback health
        run: curl -sf "${{ vars.APP_URL }}/api/health"

      - name: Notify on rollback
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":rotating_light: *Rollback triggered* on `${{ needs.resolve-env.outputs.environment }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ── 6. Release Automation (tag push only) ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-env, smoke-tests]
    if: startsWith(github.ref, 'refs/tags/v') && needs.smoke-tests.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Bump npm versions
        run: |
          cd indexer && npm version "${{ github.ref_name }}" --no-git-tag-version
          cd ../frontend && npm version "${{ github.ref_name }}" --no-git-tag-version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            CHANGELOG.md

      - name: Notify on release
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":rocket: *Released ${{ github.ref_name }}* — <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View release>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
