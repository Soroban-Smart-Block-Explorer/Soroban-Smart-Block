name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Secret Scanning ──────────────────────────────────────────────────────
  # Closes #735 — fails the build if a credential-shaped string is committed.
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Contracts ─────────────────────────────────────────────────────────────
  contracts:
    name: Contracts (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target/release/build
            target/wasm32-unknown-unknown/release/deps
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (wasm32)
        run: cargo build --target wasm32-unknown-unknown --release -p soroban-explorer-contract

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Test — explorer contract with coverage
        run: |
          cargo llvm-cov -p soroban-explorer-contract --lcov --output-path lcov-explorer.info
          cargo llvm-cov report -p soroban-explorer-contract --summary-only | tee coverage_summary_explorer.txt

      - name: Check explorer coverage threshold (80%)
        run: |
          COVERAGE=$(grep '^TOTAL' coverage_summary_explorer.txt | grep -oP '[\d.]+(?=%)' | sed -n '3p')
          COVERAGE=${COVERAGE:-0}
          echo "Explorer contract line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { 
            if (cov+0 < 80) { 
              print "FAIL: explorer coverage " cov "% < 80%"; 
              exit 1 
            } else { 
              print "PASS: explorer coverage " cov "%" 
            } 
          }'

      - name: Upload explorer coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-explorer.info
          flags: explorer-contract
          name: explorer-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test — ticket contract with coverage
        working-directory: contracts/ticket
        run: |
          cargo llvm-cov --features testutils --release --lcov --output-path lcov-ticket.info
          cargo llvm-cov report --release --summary-only | tee coverage_summary_ticket.txt

      - name: Check ticket coverage threshold (85%)
        working-directory: contracts/ticket
        run: |
          COVERAGE=$(grep '^TOTAL' coverage_summary_ticket.txt | grep -oP '[\d.]+(?=%)' | sed -n '3p')
          COVERAGE=${COVERAGE:-0}
          echo "Ticket contract line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { 
            if (cov+0 < 85) { 
              print "FAIL: ticket coverage " cov "% < 85%"; 
              exit 1 
            } else { 
              print "PASS: ticket coverage " cov "%" 
            } 
          }'

      - name: Upload ticket coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/ticket/lcov-ticket.info
          flags: ticket-contract
          name: ticket-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Migrations ────────────────────────────────────────────────────────────
  # Closes #425 — verify every SQL migration applies cleanly on a fresh
  # PostgreSQL 16 instance, in order, with no missing-table or type conflicts.
  migrations:
    name: Migrations (fresh PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install indexer deps
        run: npm ci
        working-directory: indexer

      - name: Apply all migrations on a blank database
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5433/postgres
        run: node src/migrate.js
        working-directory: indexer

  # ── Frontend Tests ────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest + React Testing Library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-20-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-20-frontend-

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm test -- --coverage
        working-directory: frontend

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/
          retention-days: 30
          if-no-files-found: ignore

  # ── Services ──────────────────────────────────────────────────────────────
  services:
    name: Services (indexer + frontend)
    runs-on: ubuntu-latest
    needs: contracts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroban
          POSTGRES_PASSWORD: soroban_secret
          POSTGRES_DB: soroban_explorer
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Rustdoc build
        run: |
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps -p soroban-explorer-contract

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            indexer/node_modules
            frontend/node_modules
          key: node-20-${{ hashFiles('indexer/package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: node-20-

      - name: Install deps
        run: |
          npm ci
          cd indexer && npm ci
          cd ../frontend && npm ci

      - name: Lockfile drift check
        run: |
          if ! git diff --exit-code package-lock.json indexer/package-lock.json frontend/package-lock.json; then
            echo "::error::A package-lock.json is out of sync — run 'npm install' in the relevant directory and commit the updated lockfile."
            exit 1
          fi

      - name: Validate OpenAPI spec (swagger-cli)
        run: npx -y @apidevtools/swagger-cli validate docs/api/openapi.yaml

      - name: Validate OpenAPI spec (redocly lint)
        run: npx -y @redocly/cli lint docs/api/openapi.yaml --format=stylish

      - name: Postman collection drift check
        run: |
          node scripts/generate-postman-collection.js /tmp/postman_collection.json
          if ! diff -u docs/api/postman_collection.json /tmp/postman_collection.json; then
            echo "::error::docs/api/postman_collection.json is out of sync with docs/api/openapi.yaml — run 'npm run generate:postman' and commit the result."
            exit 1
          fi

      - name: Indexer tests
        run: npm test -- --coverage --coverageReporters=lcov
        working-directory: indexer
        env:
          TEST_DATABASE_URL: postgres://soroban:soroban_secret@localhost:5432/soroban_explorer

      - name: Indexer concurrent-write test (#587)
        run: node --test test/concurrentWrite.test.js
        working-directory: indexer
        env:
          TEST_DATABASE_URL: postgres://soroban:soroban_secret@localhost:5432/soroban_explorer

      - name: Upload indexer coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: indexer/coverage/lcov.info
          flags: indexer
          name: indexer-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Frontend typecheck + build
        run: npm run build
        working-directory: frontend

  # ── Visual Regression ─────────────────────────────────────────────────────
  # Closes #767 — screenshot-based visual regression for the highest-traffic
  # frontend pages. Fails the PR if a covered page renders differently than
  # its committed baseline; Playwright attaches the diff image to the report.
  visual-regression:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroban
          POSTGRES_PASSWORD: soroban_secret
          POSTGRES_DB: soroban_explorer
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache e2e + frontend + indexer node_modules
        uses: actions/cache@v4
        with:
          path: |
            e2e/node_modules
            frontend/node_modules
            indexer/node_modules
          key: visual-regression-20-${{ hashFiles('e2e/package-lock.json', 'frontend/package-lock.json', 'indexer/package-lock.json') }}
          restore-keys: visual-regression-20-

      - name: Install dependencies
        run: |
          cd e2e && npm ci
          cd ../frontend && npm ci
          cd ../indexer && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run visual regression tests
        run: npm run test:visual-regression
        working-directory: e2e
        env:
          DATABASE_URL: postgres://soroban:soroban_secret@localhost:5432/soroban_explorer
          NODE_ENV: test

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

  # ── k6 PR Baseline Load Gate ─────────────────────────────────────────────
  # Closes #768 — a lightweight k6 load check on PRs touching the indexer API
  # or hot-path DB queries, so latency regressions are caught before merge.
  detect-hotpath-changes:
    name: Detect hot-path API changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      hotpath: ${{ steps.filter.outputs.hotpath }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hotpath:
              - 'indexer/src/api.js'
              - 'indexer/src/db.js'
              - 'indexer/src/queries/**'

  k6-pr-baseline:
    name: k6 PR Baseline Load Test
    runs-on: ubuntu-latest
    needs: detect-hotpath-changes
    if: needs.detect-hotpath-changes.outputs.hotpath == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroban
          POSTGRES_PASSWORD: soroban_secret
          POSTGRES_DB: soroban_explorer
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start indexer
        run: |
          npm install
          npm start > indexer.log 2>&1 &
          sleep 10
          curl -f http://localhost:3001/health
        working-directory: indexer
        env:
          DATABASE_URL: postgres://soroban:soroban_secret@localhost:5432/soroban_explorer
          NODE_ENV: test

      - name: Run lightweight k6 baseline load test
        run: k6 run test/load/pr-baseline.js
        working-directory: e2e
        env:
          INDEXER_URL: http://localhost:3001

  # ── Mutation Testing ──────────────────────────────────────────────────────
  # Closes #769 — Stryker mutation testing on the decoder, admin auth, and
  # rate-limiting modules, to catch tests that pass regardless of whether the
  # underlying logic is correct. Runs on the weekly schedule (mutation runs
  # are too slow for every PR); the mutation-kill-score target (60%, see
  # indexer/stryker.conf.json) fails the job when not met, and the HTML
  # report is uploaded as an artifact.
  mutation-testing:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install indexer deps
        run: npm ci
        working-directory: indexer

      - name: Run mutation testing
        run: npm run test:mutation
        working-directory: indexer

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: indexer/reports/mutation/
          retention-days: 30

  # ── Testnet Smoke Tests ──────────────────────────────────────────────────────
  # Gated on main branch only. Tests health, events, and WebSocket connectivity
  # against the running testnet indexer.
  testnet-smoke:
    name: Testnet Smoke Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # This job doesn't start a server itself — it's meant to smoke test a
      # real deployed testnet indexer. Without the secret configured there's
      # nothing to test against, so skip rather than fail CI on every push.
      - name: Check testnet URL is configured
        id: check
        run: |
          if [ -z "${{ secrets.TESTNET_INDEXER_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::TESTNET_INDEXER_URL secret not configured — skipping testnet smoke tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test — health endpoint
        if: steps.check.outputs.skip != 'true'
        run: |
          TESTNET_URL="${{ secrets.TESTNET_INDEXER_URL }}"
          echo "Testing health endpoint at $TESTNET_URL/api/health"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "$TESTNET_URL/api/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "503" ]; then
            echo "FAIL: Expected 200 or 503, got $HTTP_CODE"
            exit 1
          fi
          
          echo "✓ Health endpoint returned $HTTP_CODE"

      - name: Smoke test — events endpoint
        if: steps.check.outputs.skip != 'true'
        run: |
          TESTNET_URL="${{ secrets.TESTNET_INDEXER_URL }}"
          echo "Testing events endpoint at $TESTNET_URL/api/events"
          
          RESPONSE=$(curl -s "$TESTNET_URL/api/events?limit=1")
          EVENT_COUNT=$(echo "$RESPONSE" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null || echo 0)
          
          echo "Response: $RESPONSE"
          echo "Event count: $EVENT_COUNT"
          
          if [ "$EVENT_COUNT" -lt 1 ]; then
            echo "FAIL: Expected at least 1 event, got $EVENT_COUNT"
            exit 1
          fi
          
          echo "✓ Events endpoint returned $EVENT_COUNT events"

      - name: Smoke test — response time check
        if: steps.check.outputs.skip != 'true'
        run: |
          TESTNET_URL="${{ secrets.TESTNET_INDEXER_URL }}"
          echo "Testing response time at $TESTNET_URL/api/health"
          
          START=$(date +%s%N)
          RESPONSE=$(curl -s "$TESTNET_URL/api/health")
          END=$(date +%s%N)
          
          RESPONSE_TIME=$(( (END - START) / 1000000 ))
          echo "Response time: ${RESPONSE_TIME}ms"
          echo "Response: $RESPONSE"
          
          if [ "$RESPONSE_TIME" -gt 10000 ]; then
            echo "FAIL: Response time ${RESPONSE_TIME}ms exceeds 10s threshold"
            exit 1
          fi
          
          echo "✓ Response time acceptable (${RESPONSE_TIME}ms)"

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": ":red_circle: Testnet smoke test failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Testnet Smoke Test Failed*\nBranch: main\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
