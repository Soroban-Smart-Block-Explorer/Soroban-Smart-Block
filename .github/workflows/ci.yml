name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Contracts ─────────────────────────────────────────────────────────────
  contracts:
    name: Contracts (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target/release/build
            target/wasm32-unknown-unknown/release/deps
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (wasm32)
        run: cargo build --target wasm32-unknown-unknown --release -p soroban-explorer-contract

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Test — explorer contract with coverage
        run: |
          cargo llvm-cov -p soroban-explorer-contract --lcov --output-path lcov-explorer.info
          cargo llvm-cov report -p soroban-explorer-contract --summary-only | tee coverage_summary_explorer.txt

      - name: Check explorer coverage threshold (80%)
        run: |
          COVERAGE=$(grep '^TOTAL' coverage_summary_explorer.txt | grep -oP '[\d.]+(?=%)' | sed -n '3p')
          COVERAGE=${COVERAGE:-0}
          echo "Explorer contract line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { 
            if (cov+0 < 80) { 
              print "FAIL: explorer coverage " cov "% < 80%"; 
              exit 1 
            } else { 
              print "PASS: explorer coverage " cov "%" 
            } 
          }'

      - name: Upload explorer coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-explorer.info
          flags: explorer-contract
          name: explorer-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test — ticket contract with coverage
        working-directory: contracts/ticket
        run: |
          cargo llvm-cov --features testutils --release --lcov --output-path lcov-ticket.info
          cargo llvm-cov report --release --summary-only | tee coverage_summary_ticket.txt

      - name: Check ticket coverage threshold (85%)
        working-directory: contracts/ticket
        run: |
          COVERAGE=$(grep '^TOTAL' coverage_summary_ticket.txt | grep -oP '[\d.]+(?=%)' | sed -n '3p')
          COVERAGE=${COVERAGE:-0}
          echo "Ticket contract line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { 
            if (cov+0 < 85) { 
              print "FAIL: ticket coverage " cov "% < 85%"; 
              exit 1 
            } else { 
              print "PASS: ticket coverage " cov "%" 
            } 
          }'

      - name: Upload ticket coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/ticket/lcov-ticket.info
          flags: ticket-contract
          name: ticket-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Migrations ────────────────────────────────────────────────────────────
  # Closes #425 — verify every SQL migration applies cleanly on a fresh
  # PostgreSQL 16 instance, in order, with no missing-table or type conflicts.
  migrations:
    name: Migrations (fresh PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install indexer deps
        run: npm ci
        working-directory: indexer

      - name: Apply all migrations on a blank database
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5433/postgres
        run: node src/migrate.js
        working-directory: indexer

  # ── Services ──────────────────────────────────────────────────────────────
  services:
    name: Services (indexer + frontend)
    runs-on: ubuntu-latest
    needs: contracts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroban
          POSTGRES_PASSWORD: soroban_secret
          POSTGRES_DB: soroban_explorer
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Rustdoc build
        run: |
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps -p soroban-explorer-contract

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            indexer/node_modules
            frontend/node_modules
          key: node-20-${{ hashFiles('indexer/package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: node-20-

      - name: Install deps
        run: |
          cd indexer && npm ci
          cd ../frontend && npm ci

      - name: Lockfile drift check
        run: |
          if ! git diff --exit-code indexer/package-lock.json frontend/package-lock.json; then
            echo "::error::A package-lock.json is out of sync — run 'npm install' in the relevant directory and commit the updated lockfile."
            exit 1
          fi

      - name: Validate OpenAPI spec
        run: npx -y @apidevtools/swagger-cli validate docs/api/openapi.yaml

      - name: Indexer tests
        run: npm test -- --coverage --coverageReporters=lcov
        working-directory: indexer
        env:
          TEST_DATABASE_URL: postgres://soroban:soroban_secret@localhost:5432/soroban_explorer

      - name: Upload indexer coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: indexer/coverage/lcov.info
          flags: indexer
          name: indexer-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Frontend typecheck + build
        run: npm run build
        working-directory: frontend


  # ── Security Audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install indexer deps
        run: npm ci
        working-directory: indexer

      - name: Audit indexer dependencies
        run: npm audit --audit-level=high --production
        working-directory: indexer
        continue-on-error: true
        id: indexer-audit

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --production
        working-directory: frontend
        continue-on-error: true
        id: frontend-audit

      - name: Comment on PR if vulnerabilities found
        if: |
          (steps.indexer-audit.outcome == 'failure' || steps.frontend-audit.outcome == 'failure') &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `⚠️ **Security Audit Failed**\n\nHigh or critical severity vulnerabilities were detected in dependencies.\n\nRun \`npm audit --audit-level=high --production\` locally in the affected directories to review and fix.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if vulnerabilities found
        if: steps.indexer-audit.outcome == 'failure' || steps.frontend-audit.outcome == 'failure'
        run: exit 1


  # ── Deploy to Testnet ─────────────────────────────────────────────────────
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [contracts, services, security-audit]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push indexer image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          file: indexer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/indexer:testnet-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/indexer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/indexer:buildcache,mode=max

      - name: Deploy to testnet server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TESTNET_HOST }}
          username: github
          key: ${{ secrets.TESTNET_SSH_KEY }}
          script: |
            set -e
            cd /var/app/soroban-explorer
            docker pull ghcr.io/${{ github.repository }}/indexer:testnet-${{ github.sha }}
            docker-compose -f docker-compose.yml set IMAGE_TAG=testnet-${{ github.sha }}
            docker-compose -f docker-compose.yml up -d indexer

      - name: Run smoke tests
        run: |
          sleep 10
          curl -f http://${{ secrets.TESTNET_HOST }}:3001/api/events || exit 1

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Testnet deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Testnet Deployment Successful*\n\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch:* main"
                  }
                }
              ]
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Testnet deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Testnet Deployment Failed*\n\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch:* main"
                  }
                }
              ]
            }
