components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for write operations. Set via API_KEY environment variable.
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token auth support for future key management.
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Admin bearer token supplied through the `ADMIN_SECRET` environment variable.

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp, dependencies, alerts]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall health status
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of health check
          example: "2024-01-15T10:30:00.000Z"
        dependencies:
          type: object
          required: [database, cache, indexer, workers]
          properties:
            database:
              $ref: "#/components/schemas/DatabaseHealth"
            cache:
              $ref: "#/components/schemas/CacheHealth"
            indexer:
              $ref: "#/components/schemas/IndexerHealth"
            workers:
              $ref: "#/components/schemas/WorkerHealth"
        alerts:
          $ref: "#/components/schemas/AlertSummary"

    HealthErrorStatus:
      type: object
      required: [status, error, timestamp, alerts]
      properties:
        status:
          type: string
          enum: [unhealthy]
        error:
          type: string
          description: Unexpected health-check failure
        timestamp:
          type: string
          format: date-time
        alerts:
          $ref: "#/components/schemas/AlertSummary"

    AlertCondition:
      type: string
      enum:
        - INDEXER_DOWN
        - LEDGER_GAP
        - DB_FAILURE
        - RESOURCE_CONSTRAINT
        - ALL_RPC_DOWN
        - LOW_THROUGHPUT
        - DLQ_THRESHOLD
        - REORG_DETECTED

    ActiveAlert:
      type: object
      required: [condition, firedAt, durationMs]
      properties:
        condition:
          $ref: "#/components/schemas/AlertCondition"
        firedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the alert became active
          example: "2026-07-17T12:00:00.000Z"
        durationMs:
          type: integer
          minimum: 0
          description: Milliseconds the alert has remained active
          example: 47000

    AlertList:
      type: object
      required: [active, count]
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/ActiveAlert"
        count:
          type: integer
          minimum: 0
          example: 1

    AlertSummary:
      type: object
      required: [active_count, conditions]
      properties:
        active_count:
          type: integer
          minimum: 0
          example: 1
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AlertCondition"

    AlertResolveResult:
      type: object
      required: [condition, resolved]
      properties:
        condition:
          type: string
          description: Condition supplied by the operator
          example: "LEDGER_GAP"
        resolved:
          type: boolean
          description: Whether the condition was active before the request
          example: true

    DatabaseHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: "healthy"
        responseTime:
          type: number
          description: Query response time in milliseconds
          example: 5
        connections:
          type: object
          properties:
            total:
              type: number
              example: 10
            idle:
              type: number
              example: 8
            active:
              type: number
              example: 2
            waiting:
              type: number
              example: 0
        error:
          type: string
          description: Error message if unhealthy
          example: "Connection timeout"

    CacheHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, disabled]
          example: "healthy"
        responseTime:
          type: number
          description: Ping response time in milliseconds
          example: 2
        totalConnections:
          type: number
          example: 42
        opsPerSec:
          type: number
          example: 150
        error:
          type: string
          description: Error message if unhealthy
        message:
          type: string
          description: Info message if disabled
          example: "Redis not configured"

    IndexerHealth:
      type: object
      required: [status, lastLedger, lagSeconds, lastSyncAgo]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: "healthy"
        lastLedger:
          type: number
          description: Most recent indexed ledger number
          example: 1234567
        lagSeconds:
          type: number
          description: Approximate seconds behind network
          example: 5
        lastSyncAgo:
          type: number
          description: Seconds since last sync operation
          example: 3

    WorkerHealth:
      type: object
      required: [status, errors, lastRunAgo]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          example: "healthy"
        errors:
          type: number
          description: Recent error count
          example: 0
        lastRunAgo:
          type: number
          description: Seconds since last worker execution
          example: 120

    LivenessStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [alive]
          example: "alive"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    ReadinessStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          example: "ready"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        reason:
          type: string
          nullable: true
          description: Reason for not being ready
          example: "Critical dependencies unhealthy"
        dependencies:
          type: object
          description: Dependency health details (same as HealthStatus.dependencies)

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Detailed error message"

    TransactionStatus:
      type: object
      required: [tx_hash, status, ledger, error]
      properties:
        tx_hash:
          type: string
          example: "a3f1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
        status:
          type: string
          enum: [pending, success, error]
          example: "success"
        ledger:
          type: integer
          nullable: true
          description: Ledger sequence the transaction was included in, or null while pending.
          example: 1050320
        error:
          type: string
          nullable: true
          description: Error detail when status is "error", otherwise null.
          example: null

    WasmBuildMetadata:
      type: object
      required: [wasm_hash]
      properties:
        wasm_hash:
          type: string
          example: "abc123"
        contract_id:
          type: string
          nullable: true
        size_bytes:
          type: integer
          nullable: true
          example: 204800
        sdk_version:
          type: string
          nullable: true
          example: "21.0.0"
        compiler:
          type: string
          nullable: true
          example: "rustc 1.78.0"
        optimizer:
          type: string
          nullable: true
        repository:
          type: string
          nullable: true
        commit:
          type: string
          nullable: true
        producers:
          type: object
          nullable: true
          additionalProperties:
            type: string
        ledger:
          type: integer
          nullable: true
        tx_hash:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ContractAbi:
      type: object
      description: Standardised ABI JSON combining on-chain spec with registered metadata.
      required: [id, functions]
      properties:
        id:
          type: string
          example: "CC4VM2DTTR4QO4J4E5K2YUXM"
        name:
          type: string
        description:
          type: string
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        wasm_hash:
          type: string
          nullable: true

    ContractSpecFull:
      type: object
      required: [functions, types]
      properties:
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        types:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind:
                type: string
                enum: [struct, enum, union, error_enum]
              name:
                type: string
              fields:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
              cases:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: integer
                    types:
                      type: array
                      items:
                        type: string

    UpgradeRecord:
      type: object
      required: [ledger, old_hash, new_hash, tx_hash, timestamp]
      properties:
        ledger:
          type: integer
        old_hash:
          type: string
          nullable: true
        new_hash:
          type: string
          nullable: true
        tx_hash:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    CallGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, label, type]
            properties:
              id:
                type: string
              label:
                type: string
              type:
                type: string
                example: "contract"
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source:
                type: string
              target:
                type: string
              label:
                type: string
                nullable: true
              call_count:
                type: integer

    ContractTtl:
      type: object
      required: [contract_id, current_ledger, instance, code]
      properties:
        contract_id:
          type: string
        current_ledger:
          type: integer
        instance:
          type: object
          properties:
            live_until_ledger:
              type: integer
              nullable: true
        code:
          type: object
          properties:
            live_until_ledger:
              type: integer
              nullable: true

    SourceVerification:
      type: object
      required: [signer, signature, compiler_hash, wasm_hash, submitted_at]
      properties:
        signer:
          type: string
        signature:
          type: string
        compiler_hash:
          type: string
        wasm_hash:
          type: string
        submitted_at:
          type: string
          format: date-time

    TokenHolder:
      type: object
      required: [address, balance_raw, balance]
      properties:
        address:
          type: string
        balance_raw:
          type: string
          description: Raw integer balance as a string (avoids precision loss for i128 values)
        balance:
          type: string
          description: Human-readable balance formatted using the token's decimals

    NftListResponse:
      type: object
      required: [contract_id, tokens, pagination]
      properties:
        contract_id:
          type: string
        tokens:
          type: array
          items:
            type: object
            required: [token_id, owner, metadata, last_transfer_ledger]
            properties:
              token_id:
                type: string
              owner:
                type: string
              metadata:
                type: object
                nullable: true
                additionalProperties: true
              last_transfer_ledger:
                type: integer
                nullable: true
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
            has_next:
              type: boolean

    SandboxRecord:
      type: object
      required: [sandboxId, templateId]
      properties:
        sandboxId:
          type: string
          example: "sandbox-abc123"
        templateId:
          type: string
          example: "soroban-hello-world"
        files:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SandboxSummary:
      type: object
      required: [sandboxId, templateId, updated_at]
      properties:
        sandboxId:
          type: string
        templateId:
          type: string
        updated_at:
          type: string
          format: date-time

    SandboxSimulateResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        returnValue:
          type: string
          nullable: true
        cost:
          type: object
          nullable: true
          properties:
            cpuInsns:
              type: string
            memBytes:
              type: string
        minResourceFee:
          type: string
          nullable: true
        latestLedger:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true

    SimulateResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        returnValue:
          type: string
          nullable: true
        cost:
          type: object
          nullable: true
          properties:
            cpuInsns:
              type: string
            memBytes:
              type: string
        error:
          type: string
          nullable: true

    BatchSubRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Relative API path to dispatch as a sub-request, including query string.
          example: "/api/events?limit=2"
        method:
          type: string
          default: GET
          enum: [GET, POST]
        body:
          type: object
          nullable: true
          additionalProperties: true

    BatchSubResult:
      type: object
      required: [status, body]
      properties:
        status:
          type: integer
          example: 200
        body:
          description: The dispatched sub-request's own response body.
          additionalProperties: true

    AuditLogEntry:
      type: object
      required: [id, timestamp, tier, ip, method, endpoint, status_code]
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
        api_key_id:
          type: string
          nullable: true
        key_name:
          type: string
          nullable: true
        tier:
          type: string
          example: "free"
        ip:
          type: string
        method:
          type: string
          example: "GET"
        endpoint:
          type: string
          example: "/api/events"
        status_code:
          type: integer
          example: 200
        response_time_ms:
          type: integer
        rate_limit_remaining:
          type: integer
          nullable: true
        user_agent:
          type: string
          nullable: true
        request_body_hash:
          type: string
          nullable: true
          description: SHA-256 hash of the request body for state-changing calls, null otherwise.

    WalletBalance:
      type: object
      required: [asset_code, asset_issuer, balance, is_native]
      properties:
        asset_code:
          type: string
          example: "USDC"
        asset_issuer:
          type: string
          nullable: true
          description: Null for the native XLM asset
          example: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
        balance:
          type: string
          example: "42.5000000"
        is_native:
          type: boolean
          example: false

    HorizonAccount:
      type: object
      nullable: true
      description: >-
        Null when the account is unfunded (Horizon 404) or Horizon could not
        be reached — see #551.
      required: [sequence, subentry_count, home_domain]
      properties:
        sequence:
          type: string
          example: "123456789012345"
        subentry_count:
          type: integer
          example: 3
        home_domain:
          type: string
          nullable: true
          example: "example.com"

    Asset:
      type: object
      required: [code, issuer, name, decimals, logo_url, home_domain]
      properties:
        code:
          type: string
          example: "USDC"
        issuer:
          type: string
          example: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
        name:
          type: string
          nullable: true
          example: "USDC"
        decimals:
          type: integer
          example: 7
        logo_url:
          type: string
          nullable: true
          example: "https://centre.io/logo.png"
        home_domain:
          type: string
          nullable: true
          example: "centre.io"

    Rfc7807Error:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: "Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Event sequence 15 not found"

    DecodedEvent:
      type: object
      required: [seq, contract_id, function, ledger, description, raw_topics, raw_data, is_high_bloat_risk, is_clawback]
      properties:
        seq:
          type: integer
          example: 15
        contract_id:
          type: string
          example: "CC4VM2DTTR4QO4J4E5K2YUXM"
        function:
          type: string
          example: "transfer"
        ledger:
          type: integer
          example: 1050
        tx_hash:
          type: string
          example: "tx_hash_15"
        description:
          type: string
          example: "Event 15 on C1 calling transfer"
        raw_topics:
          type: array
          items:
            type: string
          example: ["GBADY234567890123456789012345678901234567890123456789012"]
        raw_data:
          type: string
          example: '{"amount":"1500"}'
        cpu_instructions:
          type: integer
          nullable: true
          example: 12000
        mem_bytes:
          type: integer
          nullable: true
          example: 4096
        fee_charged:
          type: integer
          nullable: true
          example: 1000
        is_high_bloat_risk:
          type: boolean
          example: false
        upgrade_info:
          type: object
          nullable: true
          example: null
        storage_tiers:
          type: object
          nullable: true
          example: null
        is_clawback:
          type: boolean
          example: false
        type:
          type: string
          enum: [soroban, classic]
          example: "soroban"
          description: Event category — "classic" for Horizon payment/path-payment operations, "soroban" otherwise.
        slippage_bps:
          type: integer
          nullable: true
          example: 100
          description: >-
            DEX swap slippage in basis points (1% = 100 bps), computed as
            |amount_out - min_amount_out| / min_amount_out. Present only for
            swap events where min_amount_out is known.

    CursorPaginatedEvents:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DecodedEvent"
        next_cursor:
          type: integer
          nullable: true
          example: 42

    SearchResponse:
      type: object
      required: [query, contracts, events, wallets, suggestions]
      properties:
        query:
          type: string
          example: "transfer"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/SearchContract"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DecodedEvent"
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/SearchWallet"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SearchSuggestion"

    SearchContract:
      type: object
      required: [id, name, event_count]
      properties:
        id:
          type: string
          example: "C1"
        name:
          type: string
          example: "Contract One"
        description:
          type: string
          nullable: true
          example: "First contract details"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
          example: []
        event_count:
          type: integer
          example: 18

    SearchWallet:
      type: object
      required: [address, event_count, contracts]
      properties:
        address:
          type: string
          example: "GBADY234567890123456789012345678901234567890123456789012"
        event_count:
          type: integer
          example: 5
        first_seen_ledger:
          type: integer
          nullable: true
          example: 1001
        last_seen_ledger:
          type: integer
          nullable: true
          example: 1020
        contracts:
          type: array
          items:
            type: string
          example: ["C1", "C2"]

    SearchSuggestion:
      type: object
      required: [kind, label, route, meta]
      properties:
        kind:
          type: string
          enum: [contract, event, wallet]
          example: "contract"
        label:
          type: string
          example: "Contract One"
        route:
          type: string
          example: "/contract/C1"
        meta:
          type: object
          example: { "id": "C1", "description": "First contract details" }

    ContractMeta:
      type: object
      required: [id, name, description, functions, has_circuit_breaker, is_paused, is_rwa]
      properties:
        id:
          type: string
          example: "C1"
        name:
          type: string
          example: "Contract One"
        description:
          type: string
          example: "First contract details"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        has_circuit_breaker:
          type: boolean
          example: false
        is_paused:
          type: boolean
          example: false
        is_rwa:
          type: boolean
          example: false
        rwa_type:
          type: string
          nullable: true
          example: null
        protocol_type:
          type: string
          enum: [token, dex, lending, nft, bridge, other]
          default: other
          description: Auto-tagged protocol type (Issue #518)
        is_verified:
          type: boolean
          default: false
          description: Whether the ABI has been verified against the on-chain registry (Issue #519)
        verified_ledger:
          type: integer
          nullable: true
          description: Ledger at which verification was last confirmed
        dependency_advisory:
          type: object
          nullable: true
          example: null

    AbiHistoryEntry:
      type: object
      required: [abi_version, functions, registered_by, min_ledger, created_at]
      description: Single ABI version snapshot (Issue #517)
      properties:
        abi_version:
          type: integer
          description: Monotonically increasing ABI version number
          example: 0
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        registered_by:
          type: string
          description: Address or identifier of the registrant
        min_ledger:
          type: integer
          description: Ledger at which this ABI version became active
        created_at:
          type: string
          format: date-time

    ContractsListResponse:
      type: object
      required: [contracts, pagination]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractMeta"
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    ContractRegistration:
      type: object
      required: [id, functions]
      properties:
        id:
          type: string
          example: "C4"
        name:
          type: string
          example: "Contract Four"
        description:
          type: string
          example: "Fourth contract details"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        protocol_type:
          type: string
          enum: [token, dex, lending, nft, bridge, other]
          description: Optional explicit protocol type; auto-tagged from functions if omitted

    FunctionSpec:
      type: object
      required: [name, args]
      properties:
        name:
          type: string
          example: "transfer"
        description:
          type: string
          nullable: true
          example: "Transfers tokens between wallets"
        args:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
                example: "to"
              type:
                type: string
                example: "address"

    ContractStats:
      type: object
      required: [total_events, unique_callers, first_seen_ledger, last_seen_ledger, events_per_day]
      properties:
        total_events:
          type: integer
          example: 1204
        unique_callers:
          type: integer
          example: 87
        first_seen_ledger:
          type: integer
          nullable: true
          example: 1000001
        last_seen_ledger:
          type: integer
          nullable: true
          example: 1050320
        events_per_day:
          type: array
          items:
            $ref: "#/components/schemas/DailyEventCount"

    DailyEventCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
          example: "2026-07-25"
        count:
          type: integer
          example: 42

    StorageTierCounts:
      type: object
      required: [temporary, persistent, instance]
      properties:
        temporary:
          type: integer
          example: 30
        persistent:
          type: integer
          example: 50
        instance:
          type: integer
          example: 3

    AssetMetadata:
      type: object
      required: [name, code, issuer, decimals, domain]
      properties:
        name:
          type: string
          example: "USDC"
        code:
          type: string
          example: "USDC"
        issuer:
          type: string
          example: "GA22K667OGPC3R32NRJTNQG4KWT2OFGHNNGZ2JQMSIGLT7AFHVIOMJ43"
        decimals:
          type: integer
          example: 7
        domain:
          type: string
          nullable: true
          example: "centre.io"

  headers:
    X-RateLimit-Limit:
      description: >-
        Maximum requests allowed in the current window for the active tier
        and endpoint group (sustained rpm).
      schema:
        type: integer
        example: 60
    X-RateLimit-Remaining:
      description: >-
        Tokens remaining in the current window. Always ≥ 0.
      schema:
        type: integer
        example: 42
    X-RateLimit-Reset:
      description: >-
        Unix timestamp (seconds since epoch) when the current rate-limit window
        resets and the bucket is replenished.
      schema:
        type: integer
        format: int64
        example: 1722211200
    X-RateLimit-Tier:
      description: >-
        Active rate-limit tier for this request.
        One of: `unauthenticated`, `free`, `pro`, `enterprise`.
      schema:
        type: string
        enum: [unauthenticated, free, pro, enterprise]
        example: "free"
    Retry-After:
      description: >-
        Number of seconds to wait before retrying. Only present on 429 responses.
      schema:
        type: integer
        example: 5
