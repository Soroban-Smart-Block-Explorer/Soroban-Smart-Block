openapi: "3.1.0"
info:
  title: Soroban Smart Block Explorer API
  version: "0.1.0"
  description: Human-readable Soroban contract event explorer for the Stellar blockchain.

servers:
  - url: http://localhost:3001
    description: Local development

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Comprehensive health check endpoint
      security: []
      description: |
        Returns detailed health status of the API and all dependencies including
        database, cache, indexer sync status, background workers, and active alerts.
        
        Status codes:
        - 200: Service is healthy or degraded (can handle traffic)
        - 503: Service is unhealthy (critical dependencies failed)
        
        Health levels:
        - healthy: All dependencies operational
        - degraded: Critical dependencies healthy, optional dependencies may be impaired
        - unhealthy: Critical dependencies (database or indexer) failed
      responses:
        "200":
          description: Service is healthy or degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is unhealthy (critical dependencies failed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthStatus"
                  - $ref: "#/components/schemas/HealthErrorStatus"

  /api/health:
    get:
      summary: Comprehensive health check endpoint
      security: []
      description: |
        API-prefixed alias for `/health`. Returns dependency health and a summary
        of active alert conditions.
      responses:
        "200":
          description: Service is healthy or degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is unhealthy (critical dependencies failed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthStatus"
                  - $ref: "#/components/schemas/HealthErrorStatus"

  /api/alerts:
    get:
      summary: List active alert conditions
      security: []
      description: Returns the process-local alert conditions currently firing.
      responses:
        "200":
          description: Current active alert state, including an all-clear response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"

  /health/live:
    get:
      summary: Liveness probe
      security: []
      description: |
        Kubernetes-style liveness check. Returns 200 if the service is running
        and should not be restarted. This endpoint does not check dependencies.
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"

  /health/ready:
    get:
      summary: Readiness probe
      security: []
      description: |
        Kubernetes-style readiness check. Returns 200 if the service can handle
        traffic (dependencies are healthy). Returns 503 if dependencies are down.
      responses:
        "200":
          description: Service is ready to handle traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Service is not ready (dependencies unhealthy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /api/events:
    get:
      summary: List contract events (keyset pagination)
      description: >-
        Returns a stable page of decoded events using keyset (seq-based)
        pagination. Pass the `next_cursor` value from the previous response
        as `after_seq` to fetch the next page; `next_cursor` is null when no
        further pages exist.
      parameters:
        - name: contract
          in: query
          required: false
          schema:
            type: string
            example: "CC4VM2DTTR4QO4J4E5K2YUXM"
          description: Filter by contract ID
        - name: fn
          in: query
          required: false
          schema:
            type: string
            example: "transfer"
          description: Filter by function name
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [soroban, classic]
            example: "soroban"
          description: Filter by transaction type
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            example: 42
          description: Event seq cursor (`next_cursor` from the previous page); omit for the first page
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 200
            example: 25
          description: Max number of items to return (max 200)
      responses:
        "200":
          description: Paginated events with next_cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPaginatedEvents"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid limit or after_seq value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/events:
    get:
      summary: List contract events (cursor pagination)
      description: Returns a stable page using keyset (seq-based) pagination.
      parameters:
        - name: contract
          in: query
          required: false
          schema:
            type: string
            example: "CC4VM2DTTR4QO4J4E5K2YUXM"
          description: Filter by contract ID
        - name: fn
          in: query
          required: false
          schema:
            type: string
            example: "transfer"
          description: Filter by function name
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [soroban, classic]
            example: "soroban"
          description: Filter by transaction type
        - name: after
          in: query
          required: false
          schema:
            type: integer
            example: 42
          description: Event seq cursor from the previous page
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 200
            example: 20
          description: Max number of items to return (max 200)
      responses:
        "200":
          description: Paginated events with next_cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPaginatedEvents"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid limit value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/events/{seq}:
    get:
      summary: Get single event by sequence number
      description: Returns details of a specific event using its sequence number.
      parameters:
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            example: 15
          description: Event sequence number
      responses:
        "200":
          description: Decoded event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodedEvent"
        "404":
          description: Event not found (RFC 7807 Response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfc7807Error"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/contracts/{id}:
    get:
      summary: Get contract metadata
      description: Returns metadata details for a registered contract, including its dependency advisory.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "CC4VM2DTTR4QO4J4E5K2YUXM"
          description: Contract ID
      responses:
        "200":
          description: Contract metadata with dependency advisory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractMeta"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/contracts/{id}/abi-history:
    get:
      summary: ABI version history for a contract (Issue #517)
      description: |
        Returns every ABI snapshot recorded for the contract, ordered by abi_version
        ascending. A new entry is added each time an update_contract event is
        detected. The initial registration is stored as version 0.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Contract ID
      responses:
        "200":
          description: ABI version history
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, history]
                properties:
                  contract_id:
                    type: string
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/AbiHistoryEntry"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/abi/import-github:
    post:
      summary: Bulk ABI import from a GitHub repository (Issue #520)
      description: |
        Scans a GitHub repository directory for JSON files matching the
        contractRegistry.schema.json format and bulk-upserts them into the
        contract registry. Idempotent — re-importing the same file only updates
        changed fields. Rate-limited to one call per 10 minutes per repo.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  description: GitHub repository in owner/repo format
                  example: "myorg/my-abis"
                path:
                  type: string
                  description: Directory path within the repo containing .json ABI files
                  default: "contracts/"
                  example: "contracts/"
                ref:
                  type: string
                  description: Git ref (branch, tag, or commit SHA) to read from
                  default: "main"
                  example: "main"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [imported, skipped, errors, total_files]
                properties:
                  imported:
                    type: integer
                    description: Number of contracts successfully upserted
                  skipped:
                    type: integer
                    description: Number of files skipped due to schema validation errors
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        file:
                          type: string
                        error:
                          type: string
                  total_files:
                    type: integer
                    description: Total .json files found in the directory
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited — retry after the specified number of seconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  retry_after:
                    type: integer
        "502":
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/alerts/{condition}/resolve:
    post:
      summary: Resolve an active alert condition
      description: Clears a process-local alert condition through the existing alert manager.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: condition
          in: path
          required: true
          description: Alert condition to resolve
          schema:
            $ref: "#/components/schemas/AlertCondition"
      responses:
        "200":
          description: Resolution result; `resolved` is false when the condition was not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResolveResult"
        "401":
          description: Missing or invalid admin bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/contracts:
    get:
      summary: List registered contracts
      description: Returns a paginated list of registered contracts. Supports filtering by protocol type.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: type
          in: query
          description: Filter by protocol type (Issue #518)
          schema:
            type: string
            enum: [token, dex, lending, nft, bridge, other]
      responses:
        "200":
          description: Paginated contract list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractsListResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Register contract ABI metadata
      description: Registers metadata for a new contract ID. Requires API key authentication.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRegistration"
      responses:
        "201":
          description: Contract registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: Invalid input or ABI verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Contract already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/wallet/{address}:
    get:
      summary: Get events involving a wallet address
      description: Returns a list of events associated with a specific Stellar/Soroban wallet address.
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            example: "GBADY234567890123456789012345678901234567890123456789012"
          description: Wallet address
        - name: fn
          in: query
          required: false
          schema:
            type: string
            example: "transfer,mint"
          description: >-
            Comma-separated event-type categories to filter by
            (transfer/swap/mint/burn/stake match by prefix, e.g. "swap" also
            matches "swap_exact_tokens_for_tokens"; "other" matches any
            function outside those categories). Omit to return all events.
      responses:
        "200":
          description: Events matching the wallet address (empty array if none)
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/DecodedEvent"
        "400":
          description: Invalid wallet address format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/wallet/{address}/balances:
    get:
      summary: Get classic XLM and asset balances for a wallet address
      description: >-
        Fetches the account's balances from Horizon and normalises them.
        Cached for 30 seconds per address to avoid hammering Horizon.
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            example: "GBADY234567890123456789012345678901234567890123456789012"
          description: Wallet address
      responses:
        "200":
          description: Balances for the account (XLM plus any classic/SEP-41 assets)
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items:
                      $ref: "#/components/schemas/WalletBalance"
        "400":
          description: Invalid wallet address format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found on the network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Horizon is unreachable or returned an unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/search:
    get:
      summary: Search contracts, events, wallets, and suggestions
      description: Searches across contract metadata, events, wallets, and suggestions matching the query.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            example: "transfer"
          description: Text query for contracts, events, or wallets
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
          description: Maximum number of search results to return
      responses:
        "200":
          description: Search results grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Missing search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for write operations. Set via API_KEY environment variable.
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token auth support for future key management.
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Admin bearer token supplied through the `ADMIN_SECRET` environment variable.

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp, dependencies, alerts]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall health status
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of health check
          example: "2024-01-15T10:30:00.000Z"
        dependencies:
          type: object
          required: [database, cache, indexer, workers]
          properties:
            database:
              $ref: "#/components/schemas/DatabaseHealth"
            cache:
              $ref: "#/components/schemas/CacheHealth"
            indexer:
              $ref: "#/components/schemas/IndexerHealth"
            workers:
              $ref: "#/components/schemas/WorkerHealth"
        alerts:
          $ref: "#/components/schemas/AlertSummary"

    HealthErrorStatus:
      type: object
      required: [status, error, timestamp, alerts]
      properties:
        status:
          type: string
          enum: [unhealthy]
        error:
          type: string
          description: Unexpected health-check failure
        timestamp:
          type: string
          format: date-time
        alerts:
          $ref: "#/components/schemas/AlertSummary"

    AlertCondition:
      type: string
      enum:
        - INDEXER_DOWN
        - LEDGER_GAP
        - DB_FAILURE
        - RESOURCE_CONSTRAINT
        - ALL_RPC_DOWN
        - LOW_THROUGHPUT
        - DLQ_THRESHOLD
        - REORG_DETECTED

    ActiveAlert:
      type: object
      required: [condition, firedAt, durationMs]
      properties:
        condition:
          $ref: "#/components/schemas/AlertCondition"
        firedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the alert became active
          example: "2026-07-17T12:00:00.000Z"
        durationMs:
          type: integer
          minimum: 0
          description: Milliseconds the alert has remained active
          example: 47000

    AlertList:
      type: object
      required: [active, count]
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/ActiveAlert"
        count:
          type: integer
          minimum: 0
          example: 1

    AlertSummary:
      type: object
      required: [active_count, conditions]
      properties:
        active_count:
          type: integer
          minimum: 0
          example: 1
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AlertCondition"

    AlertResolveResult:
      type: object
      required: [condition, resolved]
      properties:
        condition:
          type: string
          description: Condition supplied by the operator
          example: "LEDGER_GAP"
        resolved:
          type: boolean
          description: Whether the condition was active before the request
          example: true

    DatabaseHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: "healthy"
        responseTime:
          type: number
          description: Query response time in milliseconds
          example: 5
        connections:
          type: object
          properties:
            total:
              type: number
              example: 10
            idle:
              type: number
              example: 8
            active:
              type: number
              example: 2
            waiting:
              type: number
              example: 0
        error:
          type: string
          description: Error message if unhealthy
          example: "Connection timeout"

    CacheHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, disabled]
          example: "healthy"
        responseTime:
          type: number
          description: Ping response time in milliseconds
          example: 2
        totalConnections:
          type: number
          example: 42
        opsPerSec:
          type: number
          example: 150
        error:
          type: string
          description: Error message if unhealthy
        message:
          type: string
          description: Info message if disabled
          example: "Redis not configured"

    IndexerHealth:
      type: object
      required: [status, lastLedger, lagSeconds, lastSyncAgo]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: "healthy"
        lastLedger:
          type: number
          description: Most recent indexed ledger number
          example: 1234567
        lagSeconds:
          type: number
          description: Approximate seconds behind network
          example: 5
        lastSyncAgo:
          type: number
          description: Seconds since last sync operation
          example: 3

    WorkerHealth:
      type: object
      required: [status, errors, lastRunAgo]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          example: "healthy"
        errors:
          type: number
          description: Recent error count
          example: 0
        lastRunAgo:
          type: number
          description: Seconds since last worker execution
          example: 120

    LivenessStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [alive]
          example: "alive"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    ReadinessStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          example: "ready"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        reason:
          type: string
          nullable: true
          description: Reason for not being ready
          example: "Critical dependencies unhealthy"
        dependencies:
          type: object
          description: Dependency health details (same as HealthStatus.dependencies)

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Detailed error message"

    WalletBalance:
      type: object
      required: [asset_code, asset_issuer, balance, is_native]
      properties:
        asset_code:
          type: string
          example: "USDC"
        asset_issuer:
          type: string
          nullable: true
          description: Null for the native XLM asset
          example: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
        balance:
          type: string
          example: "42.5000000"
        is_native:
          type: boolean
          example: false

    Rfc7807Error:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: "Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Event sequence 15 not found"

    DecodedEvent:
      type: object
      required: [seq, contract_id, function, ledger, description, raw_topics, raw_data, is_high_bloat_risk, is_clawback]
      properties:
        seq:
          type: integer
          example: 15
        contract_id:
          type: string
          example: "CC4VM2DTTR4QO4J4E5K2YUXM"
        function:
          type: string
          example: "transfer"
        ledger:
          type: integer
          example: 1050
        tx_hash:
          type: string
          example: "tx_hash_15"
        description:
          type: string
          example: "Event 15 on C1 calling transfer"
        raw_topics:
          type: array
          items:
            type: string
          example: ["GBADY234567890123456789012345678901234567890123456789012"]
        raw_data:
          type: string
          example: '{"amount":"1500"}'
        cpu_instructions:
          type: integer
          nullable: true
          example: 12000
        mem_bytes:
          type: integer
          nullable: true
          example: 4096
        fee_charged:
          type: integer
          nullable: true
          example: 1000
        is_high_bloat_risk:
          type: boolean
          example: false
        upgrade_info:
          type: object
          nullable: true
          example: null
        storage_tiers:
          type: object
          nullable: true
          example: null
        is_clawback:
          type: boolean
          example: false
        type:
          type: string
          enum: [soroban, classic]
          example: "soroban"
          description: Event category — "classic" for Horizon payment/path-payment operations, "soroban" otherwise.

    Asset:
      type: object
      required: [code, issuer]
      properties:
        code:
          type: string
          example: "USDC"
        issuer:
          type: string
          example: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
        name:
          type: string
          nullable: true
          example: "Centre Consortium"
        domain:
          type: string
          nullable: true
          example: "centre.io"
        logo_url:
          type: string
          nullable: true
          example: "https://centre.io/logo.png"

    CursorPaginatedEvents:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DecodedEvent"
        next_cursor:
          type: integer
          nullable: true
          example: 42

    SearchResponse:
      type: object
      required: [query, contracts, events, wallets, suggestions]
      properties:
        query:
          type: string
          example: "transfer"
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/SearchContract"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DecodedEvent"
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/SearchWallet"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SearchSuggestion"

    SearchContract:
      type: object
      required: [id, name, event_count]
      properties:
        id:
          type: string
          example: "C1"
        name:
          type: string
          example: "Contract One"
        description:
          type: string
          nullable: true
          example: "First contract details"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
          example: []
        event_count:
          type: integer
          example: 18

    SearchWallet:
      type: object
      required: [address, event_count, contracts]
      properties:
        address:
          type: string
          example: "GBADY234567890123456789012345678901234567890123456789012"
        event_count:
          type: integer
          example: 5
        first_seen_ledger:
          type: integer
          nullable: true
          example: 1001
        last_seen_ledger:
          type: integer
          nullable: true
          example: 1020
        contracts:
          type: array
          items:
            type: string
          example: ["C1", "C2"]

    SearchSuggestion:
      type: object
      required: [kind, label, route, meta]
      properties:
        kind:
          type: string
          enum: [contract, event, wallet]
          example: "contract"
        label:
          type: string
          example: "Contract One"
        route:
          type: string
          example: "/contract/C1"
        meta:
          type: object
          example: { "id": "C1", "description": "First contract details" }

    ContractMeta:
      type: object
      required: [id, name, description, functions, has_circuit_breaker, is_paused, is_rwa]
      properties:
        id:
          type: string
          example: "C1"
        name:
          type: string
          example: "Contract One"
        description:
          type: string
          example: "First contract details"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        has_circuit_breaker:
          type: boolean
          example: false
        is_paused:
          type: boolean
          example: false
        is_rwa:
          type: boolean
          example: false
        rwa_type:
          type: string
          nullable: true
          example: null
        protocol_type:
          type: string
          enum: [token, dex, lending, nft, bridge, other]
          default: other
          description: Auto-tagged protocol type (Issue #518)
        is_verified:
          type: boolean
          default: false
          description: Whether the ABI has been verified against the on-chain registry (Issue #519)
        verified_ledger:
          type: integer
          nullable: true
          description: Ledger at which verification was last confirmed
        dependency_advisory:
          type: object
          nullable: true
          example: null

    AbiHistoryEntry:
      type: object
      required: [abi_version, functions, registered_by, min_ledger, created_at]
      description: Single ABI version snapshot (Issue #517)
      properties:
        abi_version:
          type: integer
          description: Monotonically increasing ABI version number
          example: 0
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        registered_by:
          type: string
          description: Address or identifier of the registrant
        min_ledger:
          type: integer
          description: Ledger at which this ABI version became active
        created_at:
          type: string
          format: date-time

    ContractsListResponse:
      type: object
      required: [contracts, pagination]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractMeta"
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    ContractRegistration:
      type: object
      required: [id, functions]
      properties:
        id:
          type: string
          example: "C4"
        name:
          type: string
          example: "Contract Four"
        description:
          type: string
          example: "Fourth contract details"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/FunctionSpec"
        protocol_type:
          type: string
          enum: [token, dex, lending, nft, bridge, other]
          description: Optional explicit protocol type; auto-tagged from functions if omitted

    FunctionSpec:
      type: object
      required: [name, description, args]
      properties:
        name:
          type: string
          example: "transfer"
        description:
          type: string
          example: "Transfers tokens between wallets"
        args:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
                example: "to"
              type:
                type: string
                example: "address"

    ContractStats:
      type: object
      required: [total_events, unique_callers, first_seen_ledger, last_seen_ledger, events_per_day]
      properties:
        total_events:
          type: integer
          example: 1204
        unique_callers:
          type: integer
          example: 87
        first_seen_ledger:
          type: integer
          nullable: true
          example: 1000001
        last_seen_ledger:
          type: integer
          nullable: true
          example: 1050320
        events_per_day:
          type: array
          items:
            $ref: "#/components/schemas/DailyEventCount"

    DailyEventCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
          example: "2026-07-25"
        count:
          type: integer
          example: 42

    StorageTierCounts:
      type: object
      required: [temporary, persistent, instance]
      properties:
        temporary:
          type: integer
          example: 30
        persistent:
          type: integer
          example: 50
        instance:
          type: integer
          example: 3

    AssetMetadata:
      type: object
      required: [name, code, issuer, decimals, domain]
      properties:
        name:
          type: string
          example: "USDC"
        code:
          type: string
          example: "USDC"
        issuer:
          type: string
          example: "GA22K667OGPC3R32NRJTNQG4KWT2OFGHNNGZ2JQMSIGLT7AFHVIOMJ43"
        decimals:
          type: integer
          example: 7
        domain:
          type: string
          nullable: true
          example: "centre.io"
